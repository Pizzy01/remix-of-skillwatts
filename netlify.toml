[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback : toutes les routes (/solutions, /contact, ...) sont servies
# par index.html — React Router prend le relais côté client.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache long pour les assets fingerprintés par Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
